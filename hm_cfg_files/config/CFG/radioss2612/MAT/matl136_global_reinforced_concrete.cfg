ATTRIBUTES(COMMON)
{
    KEYWORD_STR               = VALUE(STRING,"Solver Keyword");
    NUM_COMMENTS              = SIZE("NUM_COMMENTS");
    COMMENTS                  = ARRAY[NUM_COMMENTS](STRING,"Entity_Comments");
    CommentEnumField          = VALUE(INT,"User Comments");
    Mat_Name_OR_LawNo         = VALUE(INT,"");
    DUMMY                     = VALUE(STRING,"Dummy variable for Ref_Rho flag");
    TITLE                     = VALUE(STRING,"");
    IO_FLAG                   = VALUE(INT,"");
    LAW_NO                    = VALUE(STRING,""); 
    MAT_RHO                   = VALUE(FLOAT,"Initial Density");
    MAT_EC                    = VALUE(FLOAT,"Young's Modulus of concrete");
    MAT_NUC                   = VALUE(FLOAT,"Poisson Coeff. of concrete");
    MAT_FT                    = VALUE(FLOAT,"Concrete Tensile Strength");
    MAT_FC                    = VALUE(FLOAT,"Concrete Compressive Strength");
    MAT_GAMMA                 = VALUE(FLOAT,"Damage parameter: ratio of the moment-curvature slope during concrete cracking over the elastic slope before cracking.");
    MAT_QP1                   = VALUE(FLOAT,"Slope quotient prior/after cracking in positive bending");
    MAT_QP2                   = VALUE(FLOAT,"Slope quotient prior/after cracking in negative bending");
    NLAYER_REINF              = SIZE("Number of layers of steel reinforcement");
    MAT_SIGY                  = ARRAY[NLAYER_REINF](FLOAT,"Yield Strength of steel reinforcement");
    MAT_OMEGA_X               = ARRAY[NLAYER_REINF](FLOAT,"Area of the steel reinforcement in x direction");
    MAT_OMEGA_Y               = ARRAY[NLAYER_REINF](FLOAT,"Area of the steel reinforcement in y direction");
    MAT_RHO_X                 = ARRAY[NLAYER_REINF](FLOAT,"Position through the thickness of the steel reinforcement in x direction");
    MAT_RHO_Y                 = ARRAY[NLAYER_REINF](FLOAT,"Position through the thickness of the steel reinforcement in y direction");
    MAT_CN1X                  = VALUE(FLOAT,"Prager kinematic hardening coefficient linking the plastic membrane strain in x to the back membrane force in x (criterion 1 / positive bending)");
    MAT_CN1Y                  = VALUE(FLOAT,"Prager kinematic hardening coefficient linking the plastic membrane strain in y to the back membrane force in y (criterion 1 / positive bending)");
    MAT_CM1X                  = VALUE(FLOAT,"Prager kinematic hardening coefficient linking the plastic curvature in x to the back bending moment in x (criterion 1 / positive bending)");
    MAT_CM1Y                  = VALUE(FLOAT,"Prager kinematic hardening coefficient linking the plastic curvature in y to the back bending moment in y (criterion 1 / positive bending)");
    MAT_CM1XY                 = VALUE(FLOAT,"Prager kinematic hardening coefficient linking the plastic torsional curvature to the back torsional moment (criterion 1 / positive bending)");
    MAT_CN2X                  = VALUE(FLOAT,"Prager kinematic hardening coefficient linking the plastic membrane strain in x to the back membrane force in x (criterion 2 / negative bending)");
    MAT_CN2Y                  = VALUE(FLOAT,"Prager kinematic hardening coefficient linking the plastic membrane strain in y to the back membrane force in y (criterion 2 / negative bending)");
    MAT_CM2X                  = VALUE(FLOAT,"Prager kinematic hardening coefficient linking the plastic curvature in x to the back bending moment in x (criterion 2 / negative bending)");
    MAT_CM2Y                  = VALUE(FLOAT,"Prager kinematic hardening coefficient linking the plastic curvature in y to the back bending moment in y (criterion 2 / negative bending)");
    MAT_CM2XY                 = VALUE(FLOAT,"Prager kinematic hardening coefficient linking the plastic torsional curvature to the back torsional moment (criterion 2 / negative bending)");
    Heat_Inp_opt              = VALUE(INT,"Heat");  
    SUBGRP_HEAT_MAT           = VALUE(SUBOBJECT,"");
    THERM_STRESS              = VALUE(INT,"Therm Stress");
    SUBGRP_THERM_STRESS       = VALUE(SUBOBJECT,"");
}

SKEYWORDS_IDENTIFIER(COMMON)
{
    KEYWORD_STR               = 9000;
    NUM_COMMENTS              = 5110;
    COMMENTS                  = 5109;
    CommentEnumField          = 7951;
    Mat_Name_OR_LawNo         = 4538;
    DUMMY                     = -1;
    LAW_NO                    = -1;
    IO_FLAG                   = -1;
    TITLE                     = -1;
    Heat_Inp_opt              = 4346;
    SUBGRP_HEAT_MAT           = -1;
    THERM_STRESS              = 4555;
    SUBGRP_THERM_STRESS       = -1;
    MAT_RHO                   =118;
    MAT_EC                    =119;
    MAT_NUC                   =120;
    MAT_FT                    =-1;
    MAT_FC                    =-1;
    MAT_GAMMA                 =-1;
    MAT_QP1                   =-1;
    MAT_QP2                   =-1;
    NLAYER_REINF              =-1;
    MAT_SIGY                  =-1;
    MAT_OMEGA_X               =-1;
    MAT_OMEGA_Y               =-1;
    MAT_RHO_X                 =-1;
    MAT_RHO_Y                 =-1;
    MAT_CN1X                  =-1;
    MAT_CN1Y                  =-1;
    MAT_CM1X                  =-1;
    MAT_CM1Y                  =-1;
    MAT_CM1XY                 =-1;
    MAT_CN2X                  =-1;
    MAT_CN2Y                  =-1;
    MAT_CM2X                  =-1;
    MAT_CM2Y                  =-1;
    MAT_CM2XY                 =-1;
}
DRAWABLES(COMMON) {
public:
    INITIAL_DENSITY = SCALAR(MAT_RHO);
    YOUNG_MODULUS = SCALAR(MAT_EC);
    POISSON_RATIO = SCALAR(MAT_NUC);
public:
    SOUND_SPEED = EVAL((YOUNG_MODULUS/INITIAL_DENSITY)^0.5);
private:
    G = EVAL(YOUNG_MODULUS/(2*(1+POISSON_RATIO)));
    C1 = EVAL(YOUNG_MODULUS/(3*(1-2*POISSON_RATIO)));
public:
    SOUND_SPEED_SOLID = EVAL(((4*G/3+C1)/INITIAL_DENSITY)^0.5);
}

CHECK
{
    MAT_NUC >=0.0;
    MAT_NUC <0.5;
}

DEFAULTS(COMMON)
{
    Mat_Name_OR_LawNo         = 0;
}

GUI(COMMON)
{
    RADIO(CommentEnumField)
    {
        ENUM_VALUE_FLAG=TRUE;
        ADD(1,"Hide in Menu/Export");
        ADD(2,"Show in Menu/Export");
        ADD(3,"Do Not Export");
    }
    if(CommentEnumField == 2)
    {
        SIZE(NUM_COMMENTS);
        ARRAY(NUM_COMMENTS,"")
        {
            SCALAR(COMMENTS);
        }
    }
    if( Mat_Name_OR_LawNo == 1)
    {
        ASSIGN(KEYWORD_STR, "/MAT");
        ASSIGN(KEYWORD_STR, "/GLOBAL_REINFORCED_CONCRETE/");
    }
    else
    {
        ASSIGN(KEYWORD_STR, "/MAT");
        ASSIGN(KEYWORD_STR, "/LAW136/");
    }
    SCALAR(MAT_RHO)           { DIMENSION="density";       }  
    SCALAR(MAT_EC)            { DIMENSION="pressure";      }
    SCALAR(MAT_NUC)           { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_FT)            { DIMENSION="pressure";      }
    SCALAR(MAT_FC)            { DIMENSION="pressure";      }
    SCALAR(MAT_QP1)           { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_QP2)           { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_GAMMA)         { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_CN1X)          { DIMENSION="DIMENSIONLESS"; } 
    SCALAR(MAT_CN1Y)          { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_CM1X)          { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_CM1Y)          { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_CM1XY)         { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_CN2X)          { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_CN2Y)          { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_CM2X)          { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_CM2Y)          { DIMENSION="DIMENSIONLESS"; }
    SCALAR(MAT_CM2XY)         { DIMENSION="DIMENSIONLESS"; }
    SIZE(NLAYER_REINF);
    ARRAY(NLAYER_REINF, "Number of angles")
    {
        SCALAR(MAT_SIGY)          { DIMENSION="pressure";      }
        SCALAR(MAT_OMEGA_X)       { DIMENSION="l";             }
        SCALAR(MAT_OMEGA_Y)       { DIMENSION="l";             }
        SCALAR(MAT_RHO_X)         { DIMENSION="DIMENSIONLESS"; }
        SCALAR(MAT_RHO_Y)         { DIMENSION="DIMENSIONLESS"; }
    }
    graphical FLAG(Heat_Inp_opt);
    if (Heat_Inp_opt!= 0)
    {
        SUBOBJECT(SUBGRP_HEAT_MAT) {SUBTYPES = (/SUBOBJECT/HEAT);}
    }

    graphical FLAG(THERM_STRESS);
    if (THERM_STRESS!= 0) 
    {
        SUBOBJECT(SUBGRP_THERM_STRESS) {SUBTYPES = (/SUBOBJECT/THERM_STRESS);}  
    }
}

FORMAT(radioss2612)
{
    ASSIGN(IO_FLAG, 0, EXPORT);
    ASSIGN(IO_FLAG, 1,IMPORT);
    if(IO_FLAG == 1)
    {
        HEADER("/MAT/26%s",LAW_NO);
        if(LAW_NO == "GLOBAL_REINFORCED_CONCRETE" )
        {
            ASSIGN(Mat_Name_OR_LawNo,1);
        }
    }
    else if(IO_FLAG == 0 && Mat_Name_OR_LawNo == 1)
    {
        HEADER("/MAT/GLOBAL_REINFORCED_CONCRETE/%d",_ID_);
        CARD("%-100s", TITLE);
    }
    else
    {
        HEADER("/MAT/LAW136/%d",_ID_);
        CARD("%-100s", TITLE);
    }
    COMMENT("#              RHO_I");
    CARD("%20lg",MAT_RHO);
    COMMENT("#                 EC                 NUC");
    CARD("%20lg%20lg",MAT_EC,MAT_NUC);
    COMMENT("#                 FT                  FC               GAMMA                 QP1                 QP2");
    CARD("%20lg%20lg%20lg%20lg%20lg",MAT_FT,MAT_FC,MAT_GAMMA,MAT_QP1,MAT_QP2);
    COMMENT("#       NLAYER_REINF");
    CARD("%10s%10d",_BLANK_,NLAYER_REINF);
    COMMENT("#               SIGY             OMEGA_X             OMEGA_Y                RHOX                RHOY");
    FREE_CARD_LIST(NLAYER_REINF)
    {
        CARD("%20lg%20lg%20lg%20lg%20lg",MAT_SIGY,MAT_OMEGA_X,MAT_OMEGA_Y,MAT_RHO_X,MAT_RHO_Y);
    }
    COMMENT("#               CN1X                CN1Y                CM1X                CM1Y               CM1XY");
    CARD("%20lg%20lg%20lg%20lg%20lg",MAT_CN1X,MAT_CN1Y,MAT_CM1X,MAT_CM1Y,MAT_CM1XY);
    COMMENT("#               CN2X                CN2Y                CM2X                CM2Y               CM2XY");
    CARD("%20lg%20lg%20lg%20lg%20lg",MAT_CN2X,MAT_CN2Y,MAT_CM2X,MAT_CM2Y,MAT_CM2XY);
    if(Heat_Inp_opt!=0)
    {
        SUBOBJECTS(SUBGRP_HEAT_MAT,/SUBOBJECT/HEAT,_ID_);
    } 
    if(Heat_Inp_opt!=0 && THERM_STRESS !=0)
    {
        SUBOBJECTS(SUBGRP_THERM_STRESS,/SUBOBJECT/THERM_STRESS,_ID_);
    }
}

